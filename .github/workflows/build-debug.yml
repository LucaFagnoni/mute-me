name: Build Debug

on:
  workflow_dispatch: # Permette di avviare la build manualmente da GitHub
  push:
    branches: [ "main" ] # NOTA: il branch di default del repo e' "master",
                         # quindi questo trigger automatico non scatta mai.

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Compila con simboli di debug
      shell: cmd
      run: src\build.bat debug

    - name: Carica Artefatto
      uses: actions/upload-artifact@v4
      with:
        name: MuteMe-Debug-Build
        path: |
          src\build\MuteMe.exe
          src\build\MuteMe.pdb
