name: Build & Release Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Esegue la build solo quando pusho un tag (es. v1.0)

permissions:
  contents: write # FONDAMENTALE: Serve per permettere all'action di creare la Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    # MSVC e Windows SDK sono gia' presenti sui runner windows-latest,
    # build.bat li individua da solo con vswhere.
    - name: Compila (Win32 / MSVC)
      shell: cmd
      run: src\build.bat

    - name: Upload Artifact (Internal)
      uses: actions/upload-artifact@v4
      with:
        name: MuteMe-Artifact
        path: src\build\MuteMe.exe

    # L'eseguibile e' autosufficiente: nessuna DLL da affiancare.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: src\build\MuteMe.exe
        draft: false
        prerelease: false
